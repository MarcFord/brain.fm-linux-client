name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Audio and D-Bus build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config dbus

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-features

      # The D-Bus surface is the product's public API, so it is tested like
      # one - against a private bus, never the developer's session bus.
      - name: D-Bus contract tests
        run: dbus-run-session -- cargo test --workspace --features dbus-tests

  # Nothing in CI may touch the real Brain.fm API. Fixtures only.
  no-live-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert tests do not call the live API
        run: |
          if grep -rn --include='*.rs' -E 'https://(api|audio2)\.brain\.fm' \
               crates/*/tests crates/*/src/**/tests.rs 2>/dev/null \
             | grep -v 'wiremock\|fixtures\|//'; then
            echo "::error::tests must use recorded fixtures, not the live API"
            exit 1
          fi
          echo "ok: no live API calls in tests"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo check --workspace --all-features
