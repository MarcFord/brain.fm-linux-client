name: Full suite

# Runs on the protected branches, where a slow and thorough answer is the
# right trade. Everything the fast branch gate does, plus the things that
# need a session bus, a desktop toolkit, a staged install, real packages and
# real distro images.
#
# `testing` exists so that this can be exercised before main. The two are
# treated identically on purpose: a green `testing` must mean the same thing
# as a green `main`, or it is not a useful rehearsal.
#
# Why the front-end jobs run in an Arch container rather than on the runner:
# bfm-gtk opts into the gtk4 `v4_22` and libadwaita `v1_9` feature sets, so
# GTK 4.22 is a hard build-time minimum. ubuntu-latest (24.04) ships GTK
# 4.14, and no apt package changes that. The front-ends are therefore
# impossible to build on the runner, not merely awkward, and they get an
# environment where a current GTK and Kirigami 6 exist.
on:
  push:
    branches: [main, testing]
  # Also on pull requests into the protected branches, so the suite can be a
  # *required* check there. Without this it only ran after a merge, which
  # means a required-status rule naming these jobs could never be satisfied
  # by a PR and nothing could merge.
  pull_request:
    branches: [main, testing]
  workflow_dispatch:
  # Distro package names drift underneath us, so this catches breakage that
  # no commit here caused. Monday 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The whole fast gate, unchanged, so this suite is a strict superset.
  fast:
    name: Fast gate
    uses: ./.github/workflows/ci.yml

  # The front-ends: built, linted and tested where a current GTK exists.
  # The fast gate excludes these crates because its runner cannot build them,
  # so this is the only place they are checked at all.
  front-ends:
    name: Front-ends (current GTK/Qt)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # Installed before checkout because actions/checkout wants git, and the
      # base image has none.
      - name: Toolchain and toolkits
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git pkgconf dbus alsa-lib rust \
            gtk4 libadwaita gtk4-layer-shell \
            qt6-base qt6-declarative kirigami
          echo "gtk4:       $(pkg-config --modversion gtk4)"
          echo "libadwaita: $(pkg-config --modversion libadwaita-1)"
          echo "cargo:      $(cargo --version)"

      - uses: actions/checkout@v4

      - name: Report what detection found
        run: make detect

      # Detection claiming a toolkit it cannot build against would be worse
      # than not detecting it, so assert what `detect` actually said.
      - name: Detection must find both toolkits here
        run: |
          . dist/ci-assert.sh
          make detect | tee /tmp/detect.txt
          assert_contains 'GTK4 + libadwaita *: yes' /tmp/detect.txt \
            "GTK is installed but detection missed it"
          assert_contains 'Kirigami *: yes' /tmp/detect.txt \
            "Kirigami is installed but detection missed it"

      - name: Build both front-ends
        run: make build GUI=both

      - name: Lint and test the front-end crates
        run: |
          cargo clippy -p bfm-gtk -p bfm-kde --all-targets
          cargo test -p bfm-gtk -p bfm-kde

      # install.sh must agree that this machine can build the GTK app. If the
      # version gate is wrong in the strict direction it would silently stop
      # shipping the GUI to everyone.
      - name: install.sh agrees the GTK app is buildable here
        run: |
          . dist/ci-assert.sh
          ./install.sh --dry-run --yes --skip-deps --gui gtk | tee /tmp/plan.txt
          assert_contains 'GTK4 + libadwaita : yes' /tmp/plan.txt \
            "the version gate rejected a current GTK"
          assert_lacks 'too old' /tmp/plan.txt "version gate misfired"

  # The smoke checks are the only tests that exercise an installed tree
  # rather than a cargo target dir, and they have caught the most real bugs.
  smoke:
    name: Smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config dbus

      # smoke-layer needs a live Hyprland and exits 77 (skip) without one, so
      # it reports "skipped" here. smoke-install is the one that must run.
      # GUI=none because this runner cannot build the front-ends.
      - name: make smoke
        run: make smoke GUI=none | tee /tmp/smoke.txt

      - name: The smoke checks that can run here must have really run
        run: |
          . dist/ci-assert.sh
          assert_contains 'ok: installed tree activates on demand' /tmp/smoke.txt \
            "smoke-install skipped; a skip is not a pass"
          # Only smoke-layer may legitimately skip here; it needs a compositor.
          assert_contains 'ok: the watch stream tracks the daemon' /tmp/smoke.txt \
            "smoke-watch skipped; a skip is not a pass"

  # `make install` is what distro packaging and install.sh both call, so each
  # GUI selection gets a staged install and its layout asserted. Runs in the
  # Arch container because the gtk and both variants need a current GTK.
  install-layouts:
    name: Staged install (${{ matrix.gui }})
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        gui: [none, gtk, both]
    steps:
      - name: Toolchain and toolkits
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git pkgconf dbus alsa-lib rust \
            gtk4 libadwaita gtk4-layer-shell \
            qt6-base qt6-declarative kirigami

      - uses: actions/checkout@v4

      - name: Stage an install to a system prefix
        run: |
          make install GUI=${{ matrix.gui }} PREFIX=/usr DESTDIR="$PWD/stage"
          find stage -type f | sort

      - name: Always present, whatever the GUI
        run: |
          . dist/ci-assert.sh
          assert_executable stage/usr/bin/bfmd
          assert_executable stage/usr/bin/bfm
          assert_present stage/usr/share/dbus-1/services/dev.marcford.bfm.service
          assert_present stage/usr/lib/systemd/user/bfmd.service
          assert_present stage/usr/share/icons/hicolor/scalable/apps/dev.marcford.bfm.svg
          # The templates exist precisely to stop a hard-coded prefix.
          assert_lacks '@BINDIR@' stage/usr/share/dbus-1/services/dev.marcford.bfm.service \
            "prefix was not substituted"
          assert_lacks '@BINDIR@' stage/usr/lib/systemd/user/bfmd.service \
            "prefix was not substituted"
          assert_contains '^Exec=/usr/bin/bfmd' stage/usr/share/dbus-1/services/dev.marcford.bfm.service

      - name: A desktop entry only for a GUI that was built
        run: |
          . dist/ci-assert.sh
          case "${{ matrix.gui }}" in
            none)
              # An entry here would put a launcher in the menu that cannot start.
              assert_absent stage/usr/share/applications "headless install made a menu entry"
              assert_absent stage/usr/bin/bfm-gtk
              assert_absent stage/usr/bin/bfm-kde ;;
            gtk)
              assert_executable stage/usr/bin/bfm-gtk
              assert_present stage/usr/share/applications/dev.marcford.bfm.gtk.desktop
              assert_absent stage/usr/bin/bfm-kde
              assert_absent stage/usr/share/applications/dev.marcford.bfm.kde.desktop ;;
            both)
              assert_executable stage/usr/bin/bfm-gtk
              assert_executable stage/usr/bin/bfm-kde
              assert_present stage/usr/share/applications/dev.marcford.bfm.gtk.desktop
              assert_present stage/usr/share/applications/dev.marcford.bfm.kde.desktop ;;
          esac

      # A home prefix must put the user unit where systemd actually searches.
      # $PREFIX/lib/systemd/user is not on the user unit path under $HOME, and
      # installing there fails silently.
      - name: A per-user prefix puts the unit on the user unit path
        if: matrix.gui == 'none'
        run: |
          . dist/ci-assert.sh
          make install GUI=none PREFIX="$HOME/.local"
          assert_present "$HOME/.local/share/systemd/user/bfmd.service" \
            "a home prefix must use the XDG data dir"
          assert_absent "$HOME/.local/lib/systemd/user/bfmd.service" \
            "systemd never searches here under \$HOME"

      - name: Uninstall removes what it installed
        run: |
          . dist/ci-assert.sh
          make uninstall PREFIX=/usr DESTDIR="$PWD/stage"
          assert_absent stage/usr/bin/bfmd
          assert_absent stage/usr/share/dbus-1/services/dev.marcford.bfm.service

  # install.sh picks package names per distro, and those names are the least
  # portable thing in this repo. This checks them against real distro images.
  #
  # The names come from `install.sh --print-deps`, so CI reads the same tables
  # users get rather than a copy that drifts.
  #
  # Run via `docker run` rather than a job `container:`, because the Actions
  # runner's own node cannot execute inside musl images like Alpine, which
  # would otherwise be untestable.
  distro-deps:
    name: Deps resolve on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: debian:13
            refresh: apt-get update
            install: apt-get install -y --no-install-recommends
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            refresh: apt-get update
            install: apt-get install -y --no-install-recommends
          - name: Fedora
            image: fedora:latest
            refresh: 'true'
            install: dnf install -y
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            refresh: zypper --non-interactive refresh
            install: zypper --non-interactive install
          - name: Alpine
            image: alpine:latest
            refresh: apk update
            install: apk add
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the core dependencies
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e DEBIAN_FRONTEND=noninteractive \
            ${{ matrix.image }} sh -euc '
              ${{ matrix.refresh }} >/dev/null 2>&1 || true
              ./install.sh --print-deps | tee /tmp/deps.txt
              family=$(sed -n "s/^family: //p" /tmp/deps.txt)
              core=$(sed -n "s/^core: //p" /tmp/deps.txt)
              [ "$family" = unknown ] && { echo "::error::distro not recognised"; exit 1; }
              echo "--- installing core: $core"
              ${{ matrix.install }} $core
              # pkg-config is the real gate, not the package manager exit code.
              command -v pkg-config >/dev/null || { echo "::error::no pkg-config after install"; exit 1; }
              pkg-config --exists alsa || { echo "::error::alsa headers missing after installing core deps"; exit 1; }
              echo "ok: core dependencies resolve and alsa is usable"
            '

      # Which front-ends a distro can build is a fact about its release, not a
      # defect here, so this reports instead of gating. The GTK app needs GTK
      # >= 4.22, which fixed-release distros do not have yet; the output
      # records where that currently stands.
      - name: Which front-ends could this distro build? (informational)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e DEBIAN_FRONTEND=noninteractive \
            ${{ matrix.image }} sh -euc '
              ${{ matrix.refresh }} >/dev/null 2>&1 || true
              ./install.sh --print-deps > /tmp/deps.txt
              gtk=$(sed -n "s/^gtk: //p" /tmp/deps.txt)
              kde=$(sed -n "s/^kde: //p" /tmp/deps.txt)
              echo "--- gtk group: $gtk"
              ${{ matrix.install }} $gtk || echo "WARN: gtk group did not resolve"
              echo "--- kde group: $kde"
              ${{ matrix.install }} $kde || echo "WARN: kde group did not resolve"
              if pkg-config --exists gtk4; then
                v=$(pkg-config --modversion gtk4)
                if pkg-config --atleast-version=4.22 gtk4; then
                  echo "GTK front-end: buildable (gtk4 $v)"
                else
                  echo "GTK front-end: NOT buildable (gtk4 $v, needs >= 4.22)"
                fi
              else
                echo "GTK front-end: no gtk4 at all"
              fi
              pkg-config --exists Qt6Core Qt6Quick && echo "Qt: present" || echo "Qt: absent"
            '

  # One tool, both formats, from the same staged `make install` tree, so a
  # .deb and an .rpm cannot disagree about what they contain. Packaging a
  # cargo artifact directly would ship the binary without its D-Bus service
  # file and the daemon would never activate.
  #
  # Daemon and CLI only. The front-ends cannot be packaged for fixed-release
  # distros yet: they need GTK >= 4.22, and a binary built against a current
  # GTK on a rolling distro would also carry a glibc too new for the distros
  # these packages target. Front-ends are a build-from-source path for now,
  # and install.sh refuses cleanly where the toolkit is too old.
  packages:
    name: Build and verify packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config dbus rpm
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build packages
        run: make package GUI=none

      - name: The daemon package must be self-sufficient and desktop-free
        run: |
          . dist/ci-assert.sh
          dpkg-deb -c dist-pkg/bfm_*_amd64.deb | tee /tmp/bfm.list
          assert_contains 'usr/bin/bfmd' /tmp/bfm.list
          assert_contains 'usr/bin/bfm' /tmp/bfm.list
          assert_contains 'dbus-1/services/dev.marcford.bfm.service' /tmp/bfm.list \
            "without this the daemon never activates"
          assert_contains 'systemd/user/bfmd.service' /tmp/bfm.list
          # A server must not be made to pull in a desktop stack.
          assert_lacks 'bfm-gtk' /tmp/bfm.list "the daemon package must stay desktop-free"
          assert_lacks 'bfm-kde' /tmp/bfm.list "the daemon package must stay desktop-free"

      - name: The rpm must contain the same things
        run: |
          . dist/ci-assert.sh
          rpm -qlp dist-pkg/bfm-*.x86_64.rpm > /tmp/bfm.rpm.list
          cat /tmp/bfm.rpm.list
          assert_contains '/usr/bin/bfmd' /tmp/bfm.rpm.list
          assert_contains 'dbus-1/services/dev.marcford.bfm.service' /tmp/bfm.rpm.list
          assert_contains 'systemd/user/bfmd.service' /tmp/bfm.rpm.list

      - name: Install the deb for real and confirm it is usable
        run: |
          . dist/ci-assert.sh
          sudo apt-get install -y ./dist-pkg/bfm_*_amd64.deb
          assert_command bfmd
          assert_command bfm
          bfm --help >/dev/null
          bfm --version
          # Activation from a real package install, on a private bus.
          dbus-run-session -- sh -c 'busctl --user get-property \
            dev.marcford.bfm /dev/marcford/bfm dev.marcford.BrainFM1 \
            InterfaceVersion > /tmp/v.txt 2>&1' || true
          cat /tmp/v.txt
          assert_contains '^u ' /tmp/v.txt "the packaged daemon did not activate"

      - name: Removing the package leaves nothing behind
        run: |
          . dist/ci-assert.sh
          sudo apt-get remove -y bfm
          assert_no_command bfmd "package removal left the daemon behind"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.sha }}
          path: dist-pkg/*
          retention-days: 14

  # Built here as well as on a tag, because iterating on a Flatpak manifest
  # by cutting releases is no way to live. Not gating: see release.yml for
  # why, and it is deliberately absent from the required checks.
  flatpak:
    name: Flatpak bundle (informational)
    continue-on-error: true
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Validate the AppStream metadata
        run: |
          appstreamcli validate --no-net \
            packaging/flatpak/dev.marcford.bfm.metainfo.xml

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: bfm.flatpak
          manifest-path: packaging/flatpak/dev.marcford.bfm.yml
          cache-key: flatpak-builder-${{ github.sha }}
