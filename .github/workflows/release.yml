name: Release

# Packaging artifacts are built here rather than by hand, and from one tag,
# so a .deb and an .rpm can never disagree about what version they are.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The daemon and CLI need no desktop toolkit, so they build anywhere.
  # Built first: if this fails, nothing else is worth attempting.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config dbus
      - name: Build headless
        run: make build GUI=none
      - name: Verify a headless install lands correctly
        run: |
          make install GUI=none PREFIX=/usr DESTDIR="$PWD/stage"
          test -x stage/usr/bin/bfmd
          test -x stage/usr/bin/bfm
          test -f stage/usr/share/dbus-1/services/dev.marcford.bfm.service
          # A hard-coded prefix is the bug this guards against.
          ! grep -q '@BINDIR@' stage/usr/share/dbus-1/services/dev.marcford.bfm.service
          # No desktop entry may appear when no GUI was built.
          ! test -d stage/usr/share/applications
      - uses: actions/upload-artifact@v4
        with:
          name: bfm-headless-x86_64
          path: stage/

  # Both GUIs, to prove the detection picks them up when they are present.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Desktop toolkits
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config dbus \
            libgtk-4-dev libadwaita-1-dev \
            qt6-base-dev qt6-declarative-dev
      - name: Report what detection found
        run: make detect
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: bfm-desktop-x86_64
          path: target/release/bfm*

  # One tool, both formats, from the same staged `make install` tree — so a
  # .deb and an .rpm cannot disagree about what they contain. Packaging the
  # cargo artifact directly would ship the binary without its D-Bus service
  # file, and the daemon would never activate.
  packages:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies, including both desktop toolkits
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config dbus \
            libgtk-4-dev libadwaita-1-dev qt6-base-dev qt6-declarative-dev
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build packages
        run: make package
      - name: Check the packages contain what they should
        run: |
          set -e
          sudo apt-get install -y rpm
          # The daemon package must carry its service files, or D-Bus
          # activation never happens and the GUI cannot start a backend.
          dpkg-deb -c dist-pkg/bfm_*_amd64.deb | tee /tmp/bfm.list
          grep -q 'usr/bin/bfmd' /tmp/bfm.list
          grep -q 'dbus-1/services/dev.marcford.bfm.service' /tmp/bfm.list
          grep -q 'systemd/user/bfmd.service' /tmp/bfm.list
          # and must NOT drag a desktop stack onto a server
          ! grep -q 'bfm-gtk' /tmp/bfm.list
          ! grep -q 'bfm-kde' /tmp/bfm.list
          # GUI packages carry only their own files
          dpkg-deb -c dist-pkg/bfm-gtk_*_amd64.deb | grep -q 'usr/bin/bfm-gtk'
          dpkg-deb -c dist-pkg/bfm-gtk_*_amd64.deb | grep -q 'applications/.*gtk.desktop'
          # and depend on the daemon package
          dpkg-deb -f dist-pkg/bfm-gtk_*_amd64.deb Depends | grep -q 'bfm ('
          rpm -qlp dist-pkg/bfm-0.1.0-1.x86_64.rpm || true
          echo "package contents verified"
      - name: Install the deb for real and confirm it is usable
        run: |
          sudo apt-get install -y ./dist-pkg/bfm_*_amd64.deb
          command -v bfmd
          command -v bfm
          bfm --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: bfm-packages
          path: dist-pkg/*

  # Ships the daemon inside the sandbox; see docs/packaging.md for why.
  flatpak:
    needs: core
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.8
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: bfm.flatpak
          manifest-path: packaging/flatpak/dev.marcford.bfm.yml
          cache-key: flatpak-builder-${{ github.sha }}
