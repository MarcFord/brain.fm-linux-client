[workspace]
resolver = "3"
members = [
    "crates/bfm-api",
    "crates/bfm-proto",
    "crates/bfm-player",
    "crates/bfmd",
    "crates/bfm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/MarcFord/brain.fm-linux-client"
authors = ["Marc Ford"]

[workspace.dependencies]
# -- internal
bfm-api = { path = "crates/bfm-api", version = "0.1.0" }
bfm-proto = { path = "crates/bfm-proto", version = "0.1.0" }
bfm-player = { path = "crates/bfm-player", version = "0.1.0" }

# -- shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"

# reqwest 0.13 renamed `rustls-tls` to `rustls`, and split root certificates
# and query-string building into their own features.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "rustls",
    "webpki-roots",
    "stream",
] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
color-eyre = "0.6"
etcetera = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `proxy` (client) and `service` (server) are default features; we need both
# and nothing else, since bfm-proto ships the proxy and bfmd the interface.
zbus = { version = "6", default-features = false, features = ["proxy", "service", "tokio"] }
zeroize = { version = "1", features = ["derive"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
