[package]
name = "bfm-kde"
description = "Native Qt6/Kirigami front-end for bfm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "bfm-kde"
path = "src/main.rs"

[dependencies]
bfm-ui-core.workspace = true
cxx = "1"
cxx-qt = "0.10"
# QGuiApplication and QQmlApplicationEngine are behind these features.
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
cxx-qt-build = "0.10"
