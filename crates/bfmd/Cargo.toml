[package]
name = "bfmd"
description = "The bfm daemon: session orchestration, timers, hooks, MPRIS and the BrainFM1 D-Bus API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "bfmd"
path = "src/lib.rs"

[[bin]]
name = "bfmd"
path = "src/main.rs"

[dependencies]
bfm-api.workspace = true
clap.workspace = true
bfm-player.workspace = true
bfm-proto.workspace = true
color-eyre.workspace = true
# Secret Service directly, rather than through the `keyring` crate's v1
# facade: that facade caches the first connection attempt for the life of
# the process, failure included. See store.rs.
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
toml = "0.9"
tracing-subscriber.workspace = true
zbus.workspace = true

[dev-dependencies]
base64.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
