# GTK front-end. Separate so the daemon can be installed without pulling a
# desktop stack onto a server.
name: bfm-gtk
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: sound
priority: optional
maintainer: Marc Ford <marc@pigeon.ly>
description: |
  GTK4/libadwaita desktop front-end for bfm.
  Native on GNOME, and the right choice on wlroots compositors such as
  Hyprland, where it can also run as a layer-shell overlay.
vendor: Marc Ford
homepage: https://github.com/MarcFord/brain.fm-linux-client
license: MIT

contents:
  - src: stage/usr/bin/bfm-gtk
    dst: /usr/bin/bfm-gtk
  - src: stage/usr/share/applications/dev.marcford.bfm.gtk.desktop
    dst: /usr/share/applications/dev.marcford.bfm.gtk.desktop

overrides:
  deb:
    depends:
      - bfm (= ${VERSION})
      - libgtk-4-1
      - libadwaita-1-0
  rpm:
    depends:
      - bfm = ${VERSION}
      - gtk4
      - libadwaita
