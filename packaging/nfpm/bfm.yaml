# The daemon, the CLI, and the service files that make D-Bus activation
# work. Deliberately no GUI and no desktop dependencies: this installs
# cleanly on a headless server, and the front-ends are separate packages
# that depend on it.
name: bfm
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: sound
priority: optional
maintainer: Marc Ford <marc@pigeon.ly>
description: |
  Unofficial Brain.fm client for Linux.
  A D-Bus activated daemon plus a command-line client. Desktop front-ends
  are packaged separately as bfm-gtk and bfm-kde.
vendor: Marc Ford
homepage: https://github.com/MarcFord/brain.fm-linux-client
license: MIT

contents:
  - src: stage/usr/bin/bfmd
    dst: /usr/bin/bfmd
  - src: stage/usr/bin/bfm
    dst: /usr/bin/bfm
  - src: stage/usr/lib/systemd/user/bfmd.service
    dst: /usr/lib/systemd/user/bfmd.service
  - src: stage/usr/share/dbus-1/services/dev.marcford.bfm.service
    dst: /usr/share/dbus-1/services/dev.marcford.bfm.service
  - src: stage/usr/share/doc/bfm/config.example.toml
    dst: /usr/share/doc/bfm/config.example.toml
    type: config
  - src: stage/usr/share/doc/bfm/waybar.jsonc
    dst: /usr/share/doc/bfm/waybar.jsonc

# Library package names differ per distro; the libraries do not.
overrides:
  deb:
    depends:
      - libasound2t64 | libasound2
      - libdbus-1-3
    recommends:
      - playerctl
  rpm:
    depends:
      - alsa-lib
      - dbus-libs
    recommends:
      - playerctl
